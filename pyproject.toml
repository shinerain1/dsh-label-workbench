[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dsh-label-workbench"
version = "0.1.0"
description = "Durable rule-revision workflows for DSH text annotation"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
dsh-label-workbench = "dsh_label_workbench.__main__:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
dsh_label_workbench = ["*.py"]
